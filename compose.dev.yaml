# Development stack: the server in watch mode, against a sibling checkout of the UI library.
#
#   docker compose -f compose.dev.yaml up --build
#
# Dashboard: http://localhost:3030 (admin/admin). Two AdGuard Home instances to write to:
# http://localhost:3031 and http://localhost:3032 (admin / Passw0rd-dev). Add them as
# providers with the URLs http://172.30.0.21:3000 and http://172.30.0.22:3000 -- the
# addresses the server reaches them at -- and put both into one site.

services:
    server-dev:
        build:
            context: .
            dockerfile: docker/Dockerfile.server.dev
            secrets:
                - npm_token
        image: dpm-server-dev
        container_name: dpm-server-dev
        hostname: dpm-server-dev

        # Mount source code
        volumes:
            - ./server:/app/server
            - ./shared:/app/shared
            - ./package.json:/app/package.json
            - ./package-lock.json:/app/package-lock.json

            # Preserve Linux node_modules
            - /app/node_modules
            - /app/server/backend/node_modules
            - /app/server/frontend/node_modules
            - /app/shared/node_modules

            # Mount local UI components for development
            - ../react-ui-components:/app/react-ui-components

        working_dir: /app

        # Start server in watch mode
        command: npm run dev -w server/backend

        ports:
            - "3030:3030"

        networks:
            dpm-dev:
                ipv4_address: 172.30.0.10

        environment:
            - LOG_LEVEL=debug
            - NODE_ENV=development
            - VITE_USE_LOCAL_UI=true
            - VITE_UI_COMPONENTS_PATH=/app/react-ui-components

        # The dev image's CMD is bash and declares no HEALTHCHECK, so this is the only health
        # signal the dev container has. Longer start period: tsx has to compile first.
        healthcheck:
            test: ["CMD", "node", "-e", "Promise.resolve().then(() => fetch(JSON.parse(require('fs').readFileSync('/tmp/dpm-health.json', 'utf8')).url)).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            interval: 15s
            timeout: 5s
            start_period: 45s
            retries: 3

    # Two instances that should give the same answers: a site of both is what dpm keeps in step.
    # Each starts from docker/dev/adguard/AdGuardHome.yaml, copied in on its first start so that
    # AdGuard Home can write its own configuration; `down -v` starts them over.
    adguard-1:
        image: adguard/adguardhome
        container_name: dpm-adguard-1
        entrypoint: ["/bin/sh", "-c"]
        command:
            - "[ -f /opt/adguardhome/conf/AdGuardHome.yaml ] || cp /seed/AdGuardHome.yaml /opt/adguardhome/conf/; exec /opt/adguardhome/AdGuardHome --no-check-update -c /opt/adguardhome/conf/AdGuardHome.yaml -w /opt/adguardhome/work"
        volumes:
            - ./docker/dev/adguard/AdGuardHome.yaml:/seed/AdGuardHome.yaml:ro
            - adguard-1-conf:/opt/adguardhome/conf
        ports:
            - "3031:3000"
        networks:
            dpm-dev:
                ipv4_address: 172.30.0.21

    adguard-2:
        image: adguard/adguardhome
        container_name: dpm-adguard-2
        entrypoint: ["/bin/sh", "-c"]
        command:
            - "[ -f /opt/adguardhome/conf/AdGuardHome.yaml ] || cp /seed/AdGuardHome.yaml /opt/adguardhome/conf/; exec /opt/adguardhome/AdGuardHome --no-check-update -c /opt/adguardhome/conf/AdGuardHome.yaml -w /opt/adguardhome/work"
        volumes:
            - ./docker/dev/adguard/AdGuardHome.yaml:/seed/AdGuardHome.yaml:ro
            - adguard-2-conf:/opt/adguardhome/conf
        ports:
            - "3032:3000"
        networks:
            dpm-dev:
                ipv4_address: 172.30.0.22

volumes:
    adguard-1-conf:
    adguard-2-conf:

# Not 172.28.0.0/24, which kasm's and sadm's dev stacks use: this one can run beside them.
networks:
    dpm-dev:
        ipam:
            config:
                - subnet: 172.30.0.0/24

secrets:
    npm_token:
        environment: NPM_TOKEN
