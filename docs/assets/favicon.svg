<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- A compass needle, tilted: DNS points every name the way to its address. The upper
         half is filled, the lower one drawn. The plate is the dashboard's accent
         (ruic-primary, #c0303f) running into its hover shade. -->
    <defs>
        <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#DA4757" />
            <stop offset="100%" stop-color="#9A2532" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="100" height="100" rx="25" ry="25" fill="url(#plate)" />
    <g transform="translate(14, 14) scale(3)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g transform="rotate(45 12 12)">
            <path d="M12 2l4.2 10H7.8z" fill="#ffffff" />
            <path d="M7.8 12h8.4L12 22z" />
        </g>
    </g>
</svg>
