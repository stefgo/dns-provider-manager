<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- The glyph of docs/assets/favicon.svg without its teal plate: the header
         already carries a colour of its own, and a plate on it would be a
         second box inside the bar.

         The stroke is the literal white and not currentColor, because Material
         embeds the logo with an img tag. Inside an img the SVG is a document of
         its own, so there is no inherited colour to pick up and currentColor
         falls back to the black canvas text colour. -->
    <circle stroke-width="1.8" cx="12" cy="8" r="6" />
    <path stroke-width="1.3" d="M6 8h12M12 2c-2.2 2-2.2 10 0 12M12 2c2.2 2 2.2 10 0 12" />
    <path stroke-width="1.5" d="M12 14v3M5 21v-2a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2M12 17v4" />
    <g fill="#ffffff" stroke="none">
        <circle cx="5" cy="21.2" r="1.6" />
        <circle cx="12" cy="21.2" r="1.6" />
        <circle cx="19" cy="21.2" r="1.6" />
    </g>
</svg>
